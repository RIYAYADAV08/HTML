<!-- Superscript and subscript in HTML
<sup> element is used to display text slightly above the normal text.
<sub> element is used to display text slightly below the normal text. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Superscript and Subscript</title>
</head>
<body>
    <h1>H<sub>2</sub>O</h1>
    <h2>H<sub>2</sub>SO<sub>4</sub></h2>
    <h2>Pythagoras theorem says a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></h2>
    <h2>Formula for glucose is C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></h2>
</body>
</html>
