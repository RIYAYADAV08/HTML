<!-- HTML
It is the standard language used to create and structure web pages.
HTML elements- HTML elements are the standard elements that browser recognizes i.e paragraph element, heading element and image element etc.
To define HTML elements we use HTML tags.
HTML tags- The components used to design the structure of websites are called HTML tags.

Heading Element 
Heading element is used to add heading to a web page.
They have six levels.
h1- highest one
h6- lowest one
From top to bottom size decreases.

How HTML works?
HTML standard is the document that tells to the browser how HTML should work.

Boilerplate Code
<!DOCTYPE HTML> (This line tells that we are using HTML5).
(html tag)- root tag
(head tag)- In the head tag we store meta data.

<p>Hello World</p>
<p> Hello World <b>Apna College</b></p> When we use one tag inside another tag, it is called nesting, and the tags used inside are called nested tags.-->
