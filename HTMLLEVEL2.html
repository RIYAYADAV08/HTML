<!--List-->
<!-- Lists are used to display a group of related items in an organized way.
There are three types of list.
1.Unordered List- It is used to display list of items without any specific order using the bullet points.
We can also change the style of bullet points.
2.Ordered List- It is used to display list of items in a specific order using numbers or letters.
We can also change the type in ordered list.
3.Description List- It is used to display a term and its description. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <ul>
        <li>Riya</li>
        <li>Riyaz</li>
        <li>Riyam</li>
    </ul>
    <ol>
        <li>Harsh</li>
        <li>Harshul</li>
        <li>Harshit</li>
    </ol>

     <ol type = "a">
     <li>Nikita</li>
     <li>Nikitam</li>
     <li>Nikitan</li>
</ol>
    <dl>
        <dt>HTML</dt>
        <dd>It is a language</dd>
    </dl>
</body>
</html>

HTML attributes are used to add more information to the tag.

    <ol type = "a">                type- attribute   and a- attribute's value-->


<!-- Anchor Tag- Anchor Tag is used to create a hyperlink in an HTML page, which allows users to naviagte to another webpages, files or location.
href- Hypertext reference. It is an attribute. 
Absolute Link- It contains the complete URL and is used to link to webpages on the Internet.
Relative Link- Links only to files or pages within the same website. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag in HTML</title>
</head>
<body>
    <!--Absolute Link-->
    <a href="https://www.google.com/">Google</a>
    <!--Relative Link-->
    <a href="HTMLLEVEL1.html">File</a>
</body>
</html>

<!-- Image Tag
Image tag is used to add an image to a web page.
It is a single tag.
Two attributes- src and alt
src- src is used to specify the url of an image.
alt- alt is used to display an alternative text to an image.
Sometimes an image cannot be displayed due to an Internet Connetion, or the image file is missing.In such cases, alternative text is displayed helping users understand what the image represents. -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageTag</title>
</head>
<body>
    <!--Relative url>-->
    <img src = "Images/modiji.jpeg" alt = "Modiji" height = "200px"  weight = "300px">
    <!-- Image and file in which you are adding the image should be in the same folder.-->

    <!--Absolute url-->
    <img src = "https://tse1.mm.bing.net/th/id/OIP.swugxQM1tZ5VYoUsATvB3wHaFx?r=0&pid=Api&P=0&h=180" alt = "Ananya Pandey Image">
</body>
</html>
